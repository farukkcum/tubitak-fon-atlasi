name: Takvimi güncelle

on:
  schedule:
    - cron: "0 4 * * *"   # her gün 04:00 UTC = 07:00 Türkiye
  workflow_dispatch:       # Actions sekmesinden elle çalıştırma
  push:
    branches: [main]
    paths-ignore: ["takvim.json"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 1. iş: TÜBİTAK'ı tara, takvim.json'u kaydet, siteyi paketle
  tara:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Paketleri kur
        run: pip install requests beautifulsoup4

      - name: TÜBİTAK duyurularını tara
        id: scan
        continue-on-error: true   # tarama başarısız olursa önceki takvim yayında kalır
        run: python scripts/tara.py --out takvim.json

      - name: takvim.json'u depoya kaydet
        if: steps.scan.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add takvim.json
          git diff --cached --quiet || (git commit -m "Takvim: $(date -u +%F)" && git push)

      - uses: actions/configure-pages@v6

      - name: Siteyi paketle
        uses: actions/upload-pages-artifact@v5
        with:
          path: "."

  # 2. iş: paketi GitHub Pages'te yayınla
  yayinla:
    needs: tara
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
